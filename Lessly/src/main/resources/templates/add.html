<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Add Item - Lessly</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f5f5f0; color: #333; }
    nav { background: #2d6a4f; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; }
    nav h1 { color: white; font-size: 24px; }
    nav a { color: #b7e4c7; text-decoration: none; margin-left: 20px; }
    .container { max-width: 600px; margin: 40px auto; padding: 0 20px; }
    .card { background: white; border-radius: 12px; padding: 32px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    h2 { color: #2d6a4f; margin-bottom: 24px; }
    .tabs { display: flex; gap: 10px; margin-bottom: 24px; }
    .tab { padding: 8px 20px; border-radius: 20px; border: 2px solid #2d6a4f; background: white; color: #2d6a4f; cursor: pointer; font-size: 14px; }
    .tab.active { background: #2d6a4f; color: white; }
    .form-section { display: none; }
    .form-section.active { display: block; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 13px; color: #666; margin-bottom: 6px; }
    input { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
    input:focus { outline: none; border-color: #2d6a4f; }
    .btn-submit { width: 100%; padding: 12px; background: #2d6a4f; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 8px; }
    .btn-submit:hover { background: #1b4332; }
    .error { background: #fff3cd; border: 1px solid #ffc107; padding: 12px; border-radius: 8px; margin-bottom: 16px; color: #856404; }
  </style>
</head>
<body>
<nav>
  <h1>🌿 Lessly</h1>
  <div><a th:href="@{/}">← Back to Inventory</a></div>
</nav>

<div class="container">
  <div class="card">
    <h2>Add New Item</h2>

    <div th:if="${error}" class="error" th:text="${error}"></div>

    <div class="tabs">
      <button class="tab active" onclick="showTab('clothing')">Clothing</button>
      <button class="tab" onclick="showTab('electronics')">Electronics</button>
      <button class="tab" onclick="showTab('perishables')">Perishables</button>
    </div>

    <!-- Clothing Form -->
    <div id="clothing" class="form-section active">
      <form th:action="@{/add/clothing}" method="post">
        <div class="form-group"><label>Name</label><input name="name" required></div>
        <div class="form-group"><label>Brand</label><input name="brand" required></div>
        <div class="form-group"><label>Price ($)</label><input name="price" type="number" step="0.01" min="0" required></div>
        <div class="form-group"><label>Purchase Date</label><input name="purchaseDate" type="date" required></div>
        <div class="form-group"><label>Size</label><input name="size" required></div>
        <div class="form-group"><label>Color</label><input name="color" required></div>
        <button class="btn-submit">Add Clothing</button>
      </form>
    </div>

    <!-- Electronics Form -->
    <div id="electronics" class="form-section">
      <form th:action="@{/add/electronics}" method="post">
        <div class="form-group"><label>Name</label><input name="name" required></div>
        <div class="form-group"><label>Brand</label><input name="brand" required></div>
        <div class="form-group"><label>Price ($)</label><input name="price" type="number" step="0.01" min="0" required></div>
        <div class="form-group"><label>Purchase Date</label><input name="purchaseDate" type="date" required></div>
        <div class="form-group"><label>Model</label><input name="model2" required></div>
        <div class="form-group"><label>Warranty (months)</label><input name="warrantyMonths" type="number" min="0" required></div>
        <button class="btn-submit">Add Electronics</button>
      </form>
    </div>

    <!-- Perishables Form -->
    <div id="perishables" class="form-section">
      <form th:action="@{/add/perishables}" method="post">
        <div class="form-group"><label>Name</label><input name="name" required></div>
        <div class="form-group"><label>Brand</label><input name="brand" required></div>
        <div class="form-group"><label>Price ($)</label><input name="price" type="number" step="0.01" min="0" required></div>
        <div class="form-group"><label>Purchase Date</label><input name="purchaseDate" type="date" required></div>
        <div class="form-group"><label>Opened Date (optional)</label><input name="openedDate" type="date"></div>
        <div class="form-group"><label>Shelf Life (days)</label><input name="shelfLifeDays" type="number" min="1" required></div>
        <button class="btn-submit">Add Perishable</button>
      </form>
    </div>
  </div>
</div>

<script>
  function showTab(tab) {
      document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById(tab).classList.add('active');
      event.target.classList.add('active');
  }
</script>
</body>
</html>
